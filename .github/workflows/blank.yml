name: Importar ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Nombre del ZIP ubicado en la raíz del repositorio"
        required: true
        default: "plugin.zip"

permissions:
  contents: write

jobs:
  import-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar ZIP
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          if [ ! -f "$ZIP_NAME" ]; then
            echo "❌ No se encontró: $ZIP_NAME"
            echo "Los ZIP disponibles son:"
            find . -maxdepth 1 -type f -name "*.zip"
            exit 1
          fi

          echo "✅ ZIP encontrado: $ZIP_NAME"

      - name: Descomprimir ZIP
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          mkdir -p .zip_extract

          unzip -o "$ZIP_NAME" -d .zip_extract

          # Copiar todo el contenido del ZIP a la raíz
          cp -a .zip_extract/. .

          # Eliminar carpeta temporal
          rm -rf .zip_extract

          echo "✅ ZIP descomprimido"

      - name: Eliminar ZIP original
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          rm -f "$ZIP_NAME"

      - name: Commit y Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ No hubo cambios."
            exit 0
          fi

          git commit -m "Importar contenido de ZIP"
          git push
