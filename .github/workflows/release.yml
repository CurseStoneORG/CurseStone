name: Release personalizado

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej. CurseStone-alpha-v1.0)'
        required: true
        type: string
      body:
        description: 'Descripción / notas del release'
        required: true
        type: string
      prerelease:
        description: 'Marcar como pre-release (alpha/beta)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Use jobs build for compile
  build:
    name: Compile Binaries
    uses: ./.github/workflows/Build.yml
    with:
      version: ${{ inputs.version }}
      body: ${{ inputs.body }}
      prerelease: ${{ inputs.prerelease }}

  # Launch the releases with zipped binaries
  publish:
    name: Make Release ${{ inputs.version }}
    runs-on: ubuntu-22.04
    needs: [ build ]

    steps:
      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Zip the Binaries
        run: |
          VERSION='${{ inputs.version }}'
          mkdir -p out
          chmod +x dist/CurseStone-linux-x86_64/CurseStone dist/CurseStone-android-arm64/CurseStone
          (cd dist/CurseStone-linux-x86_64   && zip -9 "$GITHUB_WORKSPACE/out/CurseStone-${VERSION}-linux-x86_64.zip" CurseStone)
          (cd dist/CurseStone-android-arm64  && zip -9 "$GITHUB_WORKSPACE/out/CurseStone-${VERSION}-android-arm64.zip" CurseStone)
          (cd dist/CurseStone-windows-x86_64 && zip -9 "$GITHUB_WORKSPACE/out/CurseStone-${VERSION}-windows-x86_64.zip" CurseStone.exe)
          ls -la out/

      - name: Launch Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: ${{ inputs.body }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            out/CurseStone-${{ inputs.version }}-linux-x86_64.zip
            out/CurseStone-${{ inputs.version }}-android-arm64.zip
            out/CurseStone-${{ inputs.version }}-windows-x86_64.zip
          fail_on_unmatched_files: true
