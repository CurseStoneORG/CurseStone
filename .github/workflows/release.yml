name: Release personalizado

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej. CurseStone-alpha-v1.0)'
        required: true
        type: string
      body:
        description: 'Descripción / notas del release (usa \n para saltos de línea)'
        required: true
        type: string
      prerelease:
        description: 'Marcar como pre-release (alpha/beta)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Compile Binaries
    uses: ./.github/workflows/Build.yml
    with:
      version: ${{ inputs.version }}
      body: ${{ inputs.body }}
      prerelease: ${{ inputs.prerelease }}

  publish:
    name: Make Release ${{ inputs.version }}
    runs-on: ubuntu-22.04
    needs: [build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Copy Start Scripts
        shell: bash
        run: |
          set -euo pipefail

          # Verify the original scripts exist in the repository root
          test -f start.sh
          test -f start.bat

          # Linux x86_64
          cp start.sh dist/CurseStone-linux-x86_64/start.sh

          # Linux ARM64 (Cobalt 100)
          cp start.sh dist/CurseStone-linux-arm64/start.sh

          # Android ARM64
          cp start.sh dist/CurseStone-android-arm64/start.sh

          # Windows x86_64
          cp start.bat dist/CurseStone-windows-x86_64/start.bat

          # Preserve executable permissions for Unix scripts
          chmod +x \
            dist/CurseStone-linux-x86_64/start.sh \
            dist/CurseStone-linux-arm64/start.sh \
            dist/CurseStone-android-arm64/start.sh

      - name: Package ZIP Archives
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          mkdir -p out

          # Verify the expected binaries and scripts exist
          test -f dist/CurseStone-linux-x86_64/CurseStone
          test -f dist/CurseStone-linux-x86_64/start.sh

          test -f dist/CurseStone-linux-arm64/CurseStone
          test -f dist/CurseStone-linux-arm64/start.sh

          test -f dist/CurseStone-android-arm64/CurseStone
          test -f dist/CurseStone-android-arm64/start.sh

          test -f dist/CurseStone-windows-x86_64/CurseStone.exe
          test -f dist/CurseStone-windows-x86_64/start.bat

          # Set executable permissions
          chmod +x \
            dist/CurseStone-linux-x86_64/CurseStone \
            dist/CurseStone-linux-x86_64/start.sh \
            dist/CurseStone-linux-arm64/CurseStone \
            dist/CurseStone-linux-arm64/start.sh \
            dist/CurseStone-android-arm64/CurseStone \
            dist/CurseStone-android-arm64/start.sh

          # Linux x86_64 ZIP
          (
            cd dist/CurseStone-linux-x86_64
            zip -9 "$GITHUB_WORKSPACE/out/CurseStone-${VERSION}-linux-x86_64.zip" \
              CurseStone start.sh
          )

          # Linux ARM64 ZIP (Cobalt 100)
          (
            cd dist/CurseStone-linux-arm64
            zip -9 "$GITHUB_WORKSPACE/out/CurseStone-${VERSION}-linux-arm64.zip" \
              CurseStone start.sh
          )

          # Android ARM64 ZIP
          (
            cd dist/CurseStone-android-arm64
            zip -9 "$GITHUB_WORKSPACE/out/CurseStone-${VERSION}-android-arm64.zip" \
              CurseStone start.sh
          )

          # Windows x86_64 ZIP
          (
            cd dist/CurseStone-windows-x86_64
            zip -9 "$GITHUB_WORKSPACE/out/CurseStone-${VERSION}-windows-x86_64.zip" \
              CurseStone.exe start.bat
          )

          echo "Generated release archives:"
          ls -lh out/

          echo "Linux x86_64 archive contents:"
          unzip -l "out/CurseStone-${VERSION}-linux-x86_64.zip"

          echo "Linux ARM64 archive contents:"
          unzip -l "out/CurseStone-${VERSION}-linux-arm64.zip"

          echo "Android archive contents:"
          unzip -l "out/CurseStone-${VERSION}-android-arm64.zip"

          echo "Windows archive contents:"
          unzip -l "out/CurseStone-${VERSION}-windows-x86_64.zip"

      - name: Prepare Release Notes
        id: release_notes
        shell: bash
        env:
          BODY: ${{ inputs.body }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os

          body = os.environ["BODY"]

          # Convert escaped newline sequences into real line breaks.
          body = body.replace("\\r\\n", "\n")
          body = body.replace("\\n", "\n")
          body = body.replace("\\r", "\n")

          # Write a multiline GitHub Actions output safely.
          delimiter = "RELEASE_NOTES_EOF"

          while delimiter in body:
              delimiter += "_"

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              output.write(f"body<<{delimiter}\n")
              output.write(body)
              output.write("\n")
              output.write(f"{delimiter}\n")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            out/CurseStone-${{ inputs.version }}-linux-x86_64.zip
            out/CurseStone-${{ inputs.version }}-linux-arm64.zip
            out/CurseStone-${{ inputs.version }}-android-arm64.zip
            out/CurseStone-${{ inputs.version }}-windows-x86_64.zip
          fail_on_unmatched_files: true
