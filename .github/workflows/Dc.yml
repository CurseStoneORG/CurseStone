name: Discord Commits

on:
  push:
    branches:
      - stable

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send commits to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          commits = json.loads(os.environ["COMMITS_JSON"])
          token = os.environ["GITHUB_TOKEN"]

          sections = []

          for commit in commits:
              author = commit.get("author") or {}

              name = author.get("name") or "Unknown"
              username = author.get("username")
              message = commit.get("message", "").splitlines()[0]
              url = commit.get("url", "")

              avatar = None

              # Obtener avatar real del usuario de GitHub
              if username:
                  try:
                      api_url = f"https://api.github.com/users/{username}"

                      request = urllib.request.Request(
                          api_url,
                          headers={
                              "Authorization": f"Bearer {token}",
                              "Accept": "application/vnd.github+json"
                          }
                      )

                      with urllib.request.urlopen(request) as response:
                          user_data = json.loads(response.read().decode())

                      avatar = user_data.get("avatar_url")

                  except Exception:
                      avatar = None

              section = (
                  f":Libro: **Commit**\n"
                  f"```text\n"
                  f"{message}\n"
                  f"```\n"
                  f":emoji_24: **Autor:** `{name}`\n"
                  f"[Ver commit]({url})"
              )

              sections.append(section)

          embed = {
              "title": "CurseStone",
              "description": "\n\n".join(sections),
              "color": int("252429", 16),
              "footer": {
                  "text": "CST - 2026",
                  "icon_url": "https://github.com/CurseStoneTeam.png"
              }
          }

          payload = {
              "username": "CurseStone",
              "embeds": [embed]
          }

          request = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              print(f"Discord response: {response.status}")
