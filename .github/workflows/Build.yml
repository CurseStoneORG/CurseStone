name: Build CurseStone

on:
  push:
    branches: [stable, main, master, dev]
  pull_request:
    branches: [stable, main, master]
  workflow_dispatch:
  # release.yml reuses these builds through workflow_call.
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. CurseStone-alpha-v1.0)"
        required: false
        type: string
      body:
        description: "Release notes"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean

jobs:
  # Linux x86_64 — compile check plus the reference binary.
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build zlib1g-dev

      - name: Configure (Release)
        run: cmake -B build/linux-release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/linux-release --parallel

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: CurseStone-linux-x86_64
          path: build/linux-release/CurseStone
          retention-days: 7

  # Linux ARM64 (aarch64) — for ARM Linux hosts (Azure Cobalt 100 VMs, etc.).
  build-linux-arm64:
    name: Linux ARM64 (Cobalt 100)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cross-compile zlib for ARM64
        run: |
          cd /tmp
          wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar \
          ./configure --prefix=/opt/zlib-arm64-linux --static
          make -j$(nproc) install

      - name: Configure (Release, aarch64 cross)
        run: |
          cmake -B build/linux-arm64-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DZLIB_ROOT=/opt/zlib-arm64-linux \
            -DZLIB_INCLUDE_DIR=/opt/zlib-arm64-linux/include \
            -DZLIB_LIBRARY=/opt/zlib-arm64-linux/lib/libz.a

      - name: Build
        run: cmake --build build/linux-arm64-release --parallel

      - name: Upload Linux ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: CurseStone-linux-arm64
          path: build/linux-arm64-release/CurseStone
          retention-days: 7

  # Android ARM64 (NDK) — for Termux/Android hosting.
  build-android-arm64:
    name: Android ARM64
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: r26c
      ANDROID_API: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build unzip wget

      - name: Download Android NDK ${{ env.NDK_VERSION }}
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" \
            -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Cross-compile zlib for ARM64
        run: |
          cd /tmp
          wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          TOOLCHAIN=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          AR=$TOOLCHAIN/bin/llvm-ar \
          CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang \
          ./configure --prefix=/opt/zlib-arm64 --static
          make -j$(nproc) install

      - name: Configure CurseStone for ARM64
        run: |
          cmake -B build/android-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_ROOT=/opt/zlib-arm64 \
            -DZLIB_INCLUDE_DIR=/opt/zlib-arm64/include \
            -DZLIB_LIBRARY=/opt/zlib-arm64/lib/libz.a

      - name: Build
        run: cmake --build build/android-arm64 --parallel

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: CurseStone-android-arm64
          path: build/android-arm64/CurseStone
          retention-days: 14

  # Windows x86_64 (MSVC + Ninja).
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest

    # bash for every step: backslash line continuations break in PowerShell.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      # Exposes cl.exe plus INCLUDE/LIB so Ninja can drive MSVC.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies with vcpkg (classic mode)
        run: vcpkg install zlib:x64-windows-static-md

      # C stays at 17 on Windows: MSVC does not implement C23 fully yet.
      - name: Configure (Release)
        run: |
          cmake -B build/windows-release \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_STANDARD=17 \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build/windows-release --parallel

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: CurseStone-windows-x86_64
          path: build/windows-release/CurseStone.exe
          retention-days: 7

  # Automatic release when a v* tag is pushed.
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-arm64, build-android-arm64, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten binaries
        run: |
          mkdir -p dist/out
          mv dist/CurseStone-linux-x86_64/CurseStone       dist/out/CurseStone-linux-x86_64
          mv dist/CurseStone-linux-arm64/CurseStone        dist/out/CurseStone-linux-arm64
          mv dist/CurseStone-android-arm64/CurseStone     dist/out/CurseStone-android-arm64
          mv dist/CurseStone-windows-x86_64/CurseStone.exe dist/out/CurseStone-windows-x86_64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/out/CurseStone-linux-x86_64
            dist/out/CurseStone-linux-arm64
            dist/out/CurseStone-android-arm64
            dist/out/CurseStone-windows-x86_64.exe
          generate_release_notes: true
          body: ${{ inputs.body || '' }}
          prerelease: ${{ inputs.prerelease || false }}
