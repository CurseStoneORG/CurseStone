name: Build CurseStone

on:
  push:
    branches: [stable, main, master, dev, better-performance]
  pull_request:
    branches: [stable, main, master, better-performance]
  workflow_dispatch:
  # release.yml reuses these builds through workflow_call.
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. CurseStone-alpha-v1.0)"
        required: false
        type: string
      body:
        description: "Release notes"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean

jobs:
  # NOTE: every artifact below uses retention-days: 1. The release job
  # consumes artifacts within the SAME workflow run, so short storage
  # never breaks releases — it only keeps the Actions storage quota
  # from filling up with stale binaries.

  # Linux x86_64 — compile check plus the reference binary.
  #
  # The job builds inside an ubuntu:20.04 container on purpose: the glibc
  # of that sysroot (2.31) becomes the binary's requirement ceiling, which
  # is what common hosting images run (Pterodactyl yolks are Temurin focal
  # builds). Building on the runner's own toolchain instead leaked the
  # runner's fresh glibc into the binary (sqrtf at GLIBC_2.43, __isoc23_*
  # and fmod at 2.38) and older hosts refused to start it:
  #   "./bin/CurseStone: /lib/x86_64-linux-gnu/libm.so.6: version
  #    'GLIBC_2.43' not found"
  # tools/check_portability.sh guards the ceiling below, so runner drift
  # can never regress this silently again.
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    env:
      # focal's default gcc-9 cannot compile the C++20 sources; gcc-13
      # from the ubuntu-toolchain-r/test PPA can, and its headers still
      # target the focal glibc (2.31).
      CC: gcc-13
      CXX: g++-13

    steps:
      # git must exist before checkout runs inside the container.
      - name: Install toolchain and dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          APT="apt-get -o Acquire::Retries=3"
          # Every network step gets a hard timeout: a stalled mirror fails
          # the job fast instead of hanging it for hours.
          timeout 300 $APT update -y
          timeout 300 $APT install -y --no-install-recommends \
            ca-certificates git ninja-build zlib1g-dev
          # gcc-13 for C++20 comes from the ubuntu-toolchain PPA, which
          # still publishes for focal (focal's own gcc-9 cannot compile
          # the sources). Added as a raw source over https with
          # [trusted=yes] — TLS already authenticates the host, and this
          # avoids add-apt-repository's keyserver round-trip, which can
          # hang the job indefinitely.
          echo 'deb [trusted=yes] https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu/ focal main' \
            > /etc/apt/sources.list.d/cursestone-toolchain.list
          timeout 300 $APT update -y
          timeout 300 $APT install -y --no-install-recommends gcc-13 g++-13
          gcc-13 --version | head -1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Release, host-portable link)
        # -static-libstdc++/-static-libgcc: hosts may carry an older
        # libstdc++ than the build's GCC 13, so the C++ runtime travels
        # inside the binary. glibc stays dynamic (that is what the
        # portability check below measures).
        run: |
          cmake -B build/linux-release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build build/linux-release --parallel

      - name: Check host portability (glibc ceiling 2.31)
        run: tools/check_portability.sh build/linux-release/CurseStone 2.31

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: CurseStone-linux-x86_64
          path: build/linux-release/CurseStone
          retention-days: 1

  # Linux ARM64 (aarch64) — for ARM Linux hosts (Azure Cobalt 100 VMs, etc.).
  # NOTE: unlike build-linux this job still compiles on the runner's own
  # toolchain, so its binary carries the runner's glibc ceiling. ARM64
  # hosting images are newer and this keeps the cross toolchain simple;
  # if an ARM host ever reports "GLIBC_2.xx not found", pin this job the
  # same way (focal + a modern aarch64 cross gcc).
  build-linux-arm64:
    name: Linux ARM64 (Cobalt 100)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Cross-compile zlib for ARM64
        run: |
          cd /tmp
          wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          CC=aarch64-linux-gnu-gcc AR=aarch64-linux-gnu-ar \
          ./configure --prefix=/opt/zlib-arm64-linux --static
          make -j$(nproc) install

      - name: Configure (Release, aarch64 cross)
        run: |
          cmake -B build/linux-arm64-release \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DZLIB_ROOT=/opt/zlib-arm64-linux \
            -DZLIB_INCLUDE_DIR=/opt/zlib-arm64-linux/include \
            -DZLIB_LIBRARY=/opt/zlib-arm64-linux/lib/libz.a

      - name: Build
        run: cmake --build build/linux-arm64-release --parallel

      - name: Upload Linux ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: CurseStone-linux-arm64
          path: build/linux-arm64-release/CurseStone
          retention-days: 1

  # Android ARM64 (NDK) — for Termux/Android hosting.
  build-android-arm64:
    name: Android ARM64
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: r26c
      ANDROID_API: 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build unzip wget

      - name: Download Android NDK ${{ env.NDK_VERSION }}
        run: |
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip" \
            -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Cross-compile zlib for ARM64
        run: |
          cd /tmp
          wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xf zlib-1.3.1.tar.gz
          cd zlib-1.3.1
          TOOLCHAIN=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          AR=$TOOLCHAIN/bin/llvm-ar \
          CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang \
          ./configure --prefix=/opt/zlib-arm64 --static
          make -j$(nproc) install

      - name: Configure CurseStone for ARM64
        run: |
          cmake -B build/android-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_ROOT=/opt/zlib-arm64 \
            -DZLIB_INCLUDE_DIR=/opt/zlib-arm64/include \
            -DZLIB_LIBRARY=/opt/zlib-arm64/lib/libz.a

      - name: Build
        run: cmake --build build/android-arm64 --parallel

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: CurseStone-android-arm64
          path: build/android-arm64/CurseStone
          retention-days: 1

  # Windows x86_64 (MSVC + Ninja).
  build-windows:
    name: Windows x86_64
    runs-on: windows-latest

    # bash for every step: backslash line continuations break in PowerShell.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      # Exposes cl.exe plus INCLUDE/LIB so Ninja can drive MSVC.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies with vcpkg (classic mode)
        run: vcpkg install zlib:x64-windows-static-md

      # C stays at 17 on Windows: MSVC does not implement C23 fully yet.
      - name: Configure (Release)
        run: |
          cmake -B build/windows-release \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_STANDARD=17 \
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build build/windows-release --parallel

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: CurseStone-windows-x86_64
          path: |
            build/windows-release/CurseStone.exe
            build/windows-release/CurseStone.pdb
          retention-days: 1

  # Automatic release when a v* tag is pushed.
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-linux-arm64, build-android-arm64, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten binaries
        run: |
          mkdir -p dist/out
          mv dist/CurseStone-linux-x86_64/CurseStone       dist/out/CurseStone-linux-x86_64
          mv dist/CurseStone-linux-arm64/CurseStone        dist/out/CurseStone-linux-arm64
          mv dist/CurseStone-android-arm64/CurseStone     dist/out/CurseStone-android-arm64
          mv dist/CurseStone-windows-x86_64/CurseStone.exe dist/out/CurseStone-windows-x86_64.exe
          mv dist/CurseStone-windows-x86_64/CurseStone.pdb dist/out/CurseStone-windows-x86_64.pdb

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/out/CurseStone-linux-x86_64
            dist/out/CurseStone-linux-arm64
            dist/out/CurseStone-android-arm64
            dist/out/CurseStone-windows-x86_64.exe
            dist/out/CurseStone-windows-x86_64.pdb
          generate_release_notes: true
          body: ${{ inputs.body || '' }}
          prerelease: ${{ inputs.prerelease || false }}
