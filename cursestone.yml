# CurseStone advanced configuration.
# Basic settings live in server.properties; the motd below overrides
# the one defined there when it is set.

settings:
  motd: "pon tu motd"    # The server name shown in the client list.
  async-workers: 8       # Async task pool threads (chunk generation,
                         # encoding, compression and saves share them —
                         # more threads = faster cold-area generation).
  autosave-ticks: 6000   # 6000 ticks = 5 minutes at 20 TPS.
  debug-mode: false      # true = show ALL debug in the console: packet
                         # traces ([PKT]), RakNet diagnostics ([NET], ACK
                         # health), hexdumps and verbose gameplay traces.
                         # false = clean console with only real messages.
  console-color: auto    # Console color mode of the Diagnostic Engine:
                         # auto = colors when stdout is a terminal,
                         # always = force ANSI (pipes, some Android hosts),
                         # never = plain text everywhere.
  plugin-instruction-limit: 1000000 # Lua instructions per call (0 = unlimited).
  plugin-time-limit-ms: 100         # Milliseconds per call (0 = unlimited).
  plugin-max-errors: 10             # Consecutive errors before disabling (0 = never).

gameplay:
  keep-inventory: false  # true = players keep their items when they die.
  bed-spawn: true        # true = sleeping or tapping a bed sets the respawn
                         # point there; breaking that bed restores the world spawn.

world:
  format: "anvil"        # anvil | leveldb
  generator: "normal"    # normal | flat | nether | void
  spawn-pregen-radius: -1 # Boot-time pre-generation of the spawn square:
                          # -1 = follow view-distance, 0 = disabled,
                          # 1..16 = fixed radius in chunks.

memory:
  max-mb: 512            # Garbage collector memory budget in MB.
  gc-interval-ticks: 200 # GC interval in ticks (200 = 10 seconds at 20 TPS).

traffic:
  pacing: true                   # true = drop datagrams from sources over
                                 # their budgets and pace repeat offenders
                                 # (see the [NET] pacing lines). false = off.
  max-packets-per-tick: 250      # Datagrams per source per tick (0 = off).
  max-pings-per-sec: 30          # List pings per source per second.
  max-handshakes-per-sec: 25     # 0x05/0x07 requests per source per second.
  max-new-sessions-per-sec: 6    # New sessions per source per second.
  max-sessions-per-ip: 4         # Concurrent sessions from one source IP.
  strikes-before-pacing: 1       # Budget overflows before pacing starts.
  pacing-hold-ms: 3000           # First hold; doubles per repeat offense.
  pacing-hold-max-ms: 60000      # Escalation ceiling.
  pacing-expire-ms: 30000        # Idle tracking-entry lifetime.
