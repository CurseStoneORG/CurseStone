# CurseStone English locale
# Format: key=value

# Server messages
chat.type.text={0}: {1}
chat.type.emote=* {0} {1}
chat.type.announcement=[{0}] {1}
chat.type.admin=[Server: {0}] {1}

multiplayer.player.joined={0} joined the game
multiplayer.player.left={0} left the game
multiplayer.disconnect.kicked=Kicked from server
multiplayer.disconnect.generic=Disconnected
multiplayer.disconnect.server_shutdown=Server closed

# Installer strings (first-run wizard)
installer.welcome=Welcome to CurseStone! Let's set up your server.
installer.name_question=Server name (motd)
installer.max_players_question=Max players
installer.port_question=Server port
installer.level_name_question=Level name
installer.level_type_question=Level type (normal/flat/nether/void)
installer.gamemode_question=Default gamemode (0=survival, 1=creative, 2=adventure)
installer.difficulty_question=Difficulty (0-3)
