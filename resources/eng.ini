commands.op.success={0} is now an operator
commands.deop.success={0} is no longer an operator
commands.save-all.start=Saving...
commands.save-all.done=Saved!

# Server banner
server.start.banner=CurseStone v{0} (codename: {1})
server.start.protocol=Target: Minecraft PE {0}, protocol {1}
server.start.listening=Listening on {0}:{1}
