# CurseStone main configuration
# Mirrors PocketMine-MP's pocketmine.yml schema, adapted for C++.

settings:
  language: "eng"
  shutdown-message: "Server closed"
  async-workers: 4

server:
  ip: "0.0.0.0"
  port: 19132
  motd: "CurseStone"
  max-players: 20
  gamemode: 0          # 0=survival, 1=creative, 2=adventure
  difficulty: 1        # 0=peaceful, 1=easy, 2=normal, 3=hard
  whitelist: false
  online-mode: false
  advanced-log: true   # Log detailed session/packet info for debugging
  view-distance: 8
  autosave-ticks: 6000 # Auto-save interval (6000 ticks = 5 min at 20 TPS)

level:
  name: "world"
  format: "anvil"     # anvil (Nukkit Anvil, default) | leveldb
  generator: "normal"  # normal | flat | nether | void
  seed: 0              # 0 = random

memory:
  max-mb: 512            # RSS budget (MB) for the global GarbageCollector
  gc-interval-ticks: 200 # ticks between GC passes (200 = 10s at 20 TPS)

network:
  compression-level: 7   # zlib level 1-9
  batch-threshold: 256    # bytes before batching

logging:
  level: "info"           # debug | info | warn | error
  colored: true
